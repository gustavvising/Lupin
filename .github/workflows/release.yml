name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"

          if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)(\.([0-9]+))?(-.+)?$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[4]:-0}"
            suffix="${BASH_REMATCH[5]}"
          else
            echo "Latest tag is not a supported version: ${latest_tag:-<none>}" >&2
            exit 1
          fi

          version="${major}.${minor}.$((patch + 1))${suffix}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -PreleaseVersion="${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            "build/libs/Lupin-${VERSION}.jar" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "$TAG"
